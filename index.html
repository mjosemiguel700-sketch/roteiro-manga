 <html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Mesa de Roteiro</title>
<meta name="theme-color" content="#18459e">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Mesa de Roteiro">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="app-icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="app-icon.svg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Shippori+Mincho+B1:wght@500;700&family=Zen+Kaku+Gothic+New:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{
  --tinta:#18459e;
  --papel:#F4F4F1;
  --papel-2:#E9E8E3;
  --calha:#CFCEC8;
  --selo:#B32B23;
  --anil:#2F3E6B;
  --fraco:#6E6E68;
  --sombra:rgba(22,24,28,.10);
  --mincho:"Shippori Mincho B1",Georgia,"Times New Roman",serif;
  --gotico:"Zen Kaku Gothic New","Helvetica Neue",Arial,sans-serif;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
  color-scheme:light dark;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --tinta:#EDEDE8; --papel:#15171B; --papel-2:#1E2126; --calha:#343941;
    --selo:#E0564C; --anil:#8FA3DE; --fraco:#8E9299; --sombra:rgba(0,0,0,.4);
  }
}
:root[data-theme="dark"]{
  --tinta:#EDEDE8; --papel:#15171B; --papel-2:#1E2126; --calha:#343941;
  --selo:#E0564C; --anil:#8FA3DE; --fraco:#8E9299; --sombra:rgba(0,0,0,.4);
}
*,*::before,*::after{box-sizing:border-box}
html,body{height:100%}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{
  margin:0;background:var(--papel);color:var(--tinta);
  font-family:var(--gotico);font-size:15px;line-height:1.55;
  -webkit-text-size-adjust:100%;
}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--anil);outline-offset:2px}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}

/* ---------- estrutura ---------- */
.app{display:flex;height:100%;min-height:0}
.lateral{
  width:272px;flex:0 0 272px;background:var(--papel-2);
  border-right:1px solid var(--calha);display:flex;flex-direction:column;min-height:0;
}
.marca{padding:18px 18px 12px;border-bottom:1px solid var(--calha)}
.marca h1{
  margin:0;font-family:var(--mincho);font-weight:700;font-size:22px;letter-spacing:.02em;line-height:1.2;
}
.marca p{margin:2px 0 0;font-size:12px;color:var(--fraco)}
.rolagem{overflow-y:auto;flex:1;min-height:0;padding:12px 10px 24px}
.grupo-titulo{
  font-family:var(--mincho);font-size:13px;font-weight:700;color:var(--fraco);
  padding:8px 8px 6px;display:flex;justify-content:space-between;align-items:center;gap:8px;
}
.item{
  display:flex;align-items:center;gap:8px;width:100%;text-align:left;
  background:none;border:0;border-left:3px solid transparent;
  padding:7px 8px;border-radius:0 4px 4px 0;cursor:pointer;
}
.item:hover{background:var(--papel)}
.item[aria-current="true"]{border-left-color:var(--selo);background:var(--papel);font-weight:500}
.item .rotulo{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.item .contagem{font-size:11px;color:var(--fraco);font-variant-numeric:tabular-nums}
.item.cap{padding-left:18px;font-size:14px}
.vazio-lateral{padding:10px 10px;font-size:13px;color:var(--fraco)}

/* ---------- botões ---------- */
.bt{
  border:1px solid var(--calha);background:var(--papel);color:var(--tinta);
  border-radius:3px;padding:5px 10px;font-size:13px;cursor:pointer;
}
.bt:hover{border-color:var(--tinta)}
.bt.forte{background:var(--tinta);color:var(--papel);border-color:var(--tinta)}
.bt.forte:hover{opacity:.85}
.bt.mini{padding:2px 7px;font-size:12px;line-height:1.5}
.bt.risco{color:var(--selo)}
.bt:disabled{opacity:.4;cursor:default}
.bt-texto{background:none;border:0;color:var(--fraco);cursor:pointer;font-size:12px;padding:2px 4px;border-radius:3px}
.bt-texto:hover{color:var(--tinta);background:var(--papel-2)}

/* ---------- área principal ---------- */
.principal{flex:1;min-width:0;display:flex;flex-direction:column;min-height:0}
.barra{
  display:flex;align-items:center;gap:10px;flex-wrap:wrap;
  padding:12px 20px;border-bottom:1px solid var(--calha);background:var(--papel);
  position:sticky;top:env(safe-area-inset-top,0px);z-index:5;
}
.barra .tit{flex:1;min-width:140px}
.barra .tit input{
  width:100%;background:none;border:0;border-bottom:1px dashed transparent;
  font-family:var(--mincho);font-size:19px;font-weight:700;padding:2px 0;
}
.barra .tit input:hover{border-bottom-color:var(--calha)}
.barra .tit input:focus{outline:none;border-bottom-color:var(--anil)}
.estado{font-size:12px;color:var(--fraco);min-width:74px;text-align:right}
.tela{flex:1;overflow-y:auto;min-height:0;padding:22px 20px 96px}
.folha{max-width:780px;margin:0 auto}

/* ---------- página ---------- */
.pagina{margin:0 0 34px}
.cabeca-pagina{
  display:flex;align-items:baseline;gap:12px;
  border-bottom:2px solid var(--tinta);padding-bottom:5px;margin-bottom:14px;
}
.cabeca-pagina h2{margin:0;font-family:var(--mincho);font-size:17px;font-weight:700}
.cabeca-pagina .info{font-size:12px;color:var(--fraco);flex:1}
.aviso-densidade{color:var(--selo)}

/* ---------- painel ---------- */
.painel{
  background:var(--papel);border:2px solid var(--tinta);
  box-shadow:3px 3px 0 var(--sombra);
  margin-bottom:14px;position:relative;
}
.painel-topo{
  display:flex;align-items:center;gap:10px;flex-wrap:wrap;
  padding:8px 10px;border-bottom:1px solid var(--calha);background:var(--papel-2);
}
.num{
  font-family:var(--mincho);font-weight:700;font-size:15px;
  min-width:26px;height:26px;display:grid;place-items:center;
  background:var(--tinta);color:var(--papel);padding:0 6px;
}
.painel-topo select{
  background:var(--papel);border:1px solid var(--calha);border-radius:3px;
  padding:3px 6px;font-size:13px;max-width:210px;
}
.acoes{margin-left:auto;display:flex;gap:2px}
.corpo{padding:10px}
.campo{margin-bottom:10px}
.campo:last-child{margin-bottom:0}
.campo > label{display:block;font-size:12px;color:var(--fraco);margin-bottom:3px}
textarea,input[type=text]{
  width:100%;background:transparent;border:1px solid var(--calha);border-radius:3px;
  padding:7px 8px;resize:vertical;
}
textarea:focus,input[type=text]:focus{outline:none;border-color:var(--anil)}
textarea.acao{min-height:58px;line-height:1.5}
textarea.sfx{min-height:36px;font-family:var(--mincho);font-weight:700;letter-spacing:.06em}
textarea.nota{min-height:36px;color:var(--anil);font-size:13.5px}

.painel-rotulo{font-family:var(--mincho);font-weight:700;font-size:14px;color:var(--fraco)}

/* ---------- escolhas de composição do painel ---------- */
.campos-painel{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.campos-painel .campo{margin:0}
.campos-painel select{
  width:100%;background:var(--papel);border:1px solid var(--calha);border-radius:3px;
  padding:6px 7px;font-size:13px;
}
.campos-painel select:focus{outline:none;border-color:var(--anil)}

/* ---------- falas ---------- */
.fala{display:flex;gap:6px;align-items:flex-start;margin-bottom:6px}
.fala .quem{flex:0 0 30%;min-width:100px}
.fala .quem input{font-weight:500}
.fala .diz{flex:1;min-width:0}
.fala textarea{min-height:38px}
.fala .rm{flex:0 0 auto;align-self:center}

/* ---------- detalhes recolhíveis ---------- */
details.detalhes{margin-top:4px;border-top:1px solid var(--calha);padding-top:2px}
details.detalhes summary{
  cursor:pointer;font-size:12px;color:var(--fraco);padding:6px 0;list-style:none;
  display:flex;align-items:center;gap:5px;
}
details.detalhes summary::-webkit-details-marker{display:none}
details.detalhes summary::before{content:"▸";font-size:10px}
details.detalhes[open] summary::before{content:"▾"}
details.detalhes summary:hover{color:var(--tinta)}
details.detalhes .campo{margin-top:8px}

.add-linha{display:flex;gap:8px;flex-wrap:wrap;margin-top:8px}
.add-pagina{
  width:100%;border:1px dashed var(--calha);background:none;color:var(--fraco);
  padding:12px;cursor:pointer;border-radius:4px;font-size:14px;
}
.add-pagina:hover{border-color:var(--tinta);color:var(--tinta)}

/* ---------- vazio / boas-vindas ---------- */
.centro{max-width:560px;margin:8vh auto;text-align:left}
.centro h2{font-family:var(--mincho);font-size:26px;margin:0 0 10px}
.centro p{color:var(--fraco);margin:0 0 18px;max-width:52ch}

/* ---------- painel de exportação ---------- */
dialog{
  border:2px solid var(--tinta);background:var(--papel);color:var(--tinta);
  padding:0;max-width:min(760px,92vw);width:100%;box-shadow:6px 6px 0 var(--sombra);
}
dialog::backdrop{background:rgba(0,0,0,.45)}
.dlg-topo{display:flex;align-items:center;gap:10px;padding:12px 14px;border-bottom:1px solid var(--calha)}
.dlg-topo h3{margin:0;font-family:var(--mincho);font-size:17px;flex:1}
.dlg-corpo{padding:14px}
.dlg-corpo textarea{min-height:min(52vh,420px);font-family:ui-monospace,"SF Mono",Menlo,Consolas,monospace;font-size:12.5px;line-height:1.5}
.dlg-pe{display:flex;gap:8px;justify-content:flex-end;padding:0 14px 14px;flex-wrap:wrap}

/* ---------- popover: escolha de quantidade ---------- */
.pop-qtd{
  position:fixed;z-index:60;background:var(--papel);border:1px solid var(--tinta);
  box-shadow:3px 3px 0 var(--sombra);border-radius:4px;padding:6px;min-width:200px;
  max-width:min(320px,86vw);max-height:min(70vh,420px);overflow-y:auto;
}
.pop-qtd-titulo{font-size:11px;color:var(--fraco);padding:2px 6px 4px}
.pop-qtd-sep{margin-top:5px;padding-top:7px;border-top:1px solid var(--calha)}
.pop-qtd-item{
  display:block;width:100%;text-align:left;background:none;border:0;
  padding:7px 8px;border-radius:3px;cursor:pointer;font-size:13.5px;color:var(--tinta);
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap;
}
.pop-qtd-item:hover{background:var(--papel-2)}
.pop-qtd-outro{display:flex;gap:5px;margin-top:5px;padding-top:5px;border-top:1px solid var(--calha)}
.pop-qtd-outro input{
  width:0;flex:1;background:var(--papel);border:1px solid var(--calha);border-radius:3px;padding:5px 6px;font-size:13px;
}

/* ---------- aviso ---------- */
.aviso{
  position:fixed;left:50%;transform:translateX(-50%);
  bottom:calc(18px + env(safe-area-inset-bottom,0px));
  background:var(--tinta);color:var(--papel);padding:9px 16px;border-radius:4px;
  font-size:13px;z-index:50;max-width:88vw;
}
.oculto{display:none!important}

/* ---------- mobile ---------- */
.bt-menu{display:none}
@media (max-width:820px){
  .app{position:relative}
  .lateral{
    position:fixed;z-index:20;top:0;bottom:0;left:0;width:84vw;max-width:300px;
    transform:translateX(-102%);transition:transform .18s ease;
    padding-top:env(safe-area-inset-top,0px);
  }
  .lateral.aberta{transform:none;box-shadow:0 0 0 100vmax rgba(0,0,0,.4)}
  .bt-menu{display:inline-flex}
  .tela{padding:16px 12px 96px}
  .barra{padding:10px 12px}
  .fala{flex-wrap:wrap}
  .fala .quem{flex:1 1 100%;min-width:0}
  .fala .diz{flex:1 1 100%}
}
@media (max-width:520px){.campos-painel{grid-template-columns:1fr}}
</style>
</head>
<body>

<div class="app">
  <aside class="lateral" id="lateral">
    <div class="marca">
      <h1>Mesa de Roteiro</h1>
      <p>Escrita de mangá, painel a painel</p>
    </div>
    <div class="rolagem">
      <div class="grupo-titulo">
        <span>Obras</span>
        <button class="bt mini" id="novaObra">Nova obra</button>
      </div>
      <form id="formObra" class="oculto" autocomplete="off">
        <input type="text" id="campoObra" placeholder="Nome da obra" maxlength="120" style="width:100%;background:var(--papel);border:1px solid var(--calha);border-radius:3px;padding:6px 8px;margin:2px 8px 6px;width:calc(100% - 16px)">
        <div style="display:flex;gap:6px;margin:0 8px 10px">
          <button type="submit" class="bt mini forte">Criar</button>
          <button type="button" class="bt mini" id="cancelarObra">Cancelar</button>
        </div>
      </form>
      <div id="listaObras"></div>
      <div id="blocoCapitulos" class="oculto">
        <div class="grupo-titulo" style="margin-top:14px">
          <span>Capítulos</span>
          <button class="bt mini" id="novoCap">Novo</button>
        </div>
        <div id="listaCaps"></div>
      </div>
    </div>
  </aside>

  <main class="principal">
    <div class="barra">
      <button class="bt bt-menu" id="btMenu" aria-label="Abrir lista de obras">☰</button>
      <div class="tit">
        <input id="tituloCap" type="text" placeholder="Título do capítulo" aria-label="Título do capítulo" disabled>
      </div>
      <button class="bt" id="btExportar" disabled>Exportar</button>
      <span class="estado" id="estado"></span>

  </main>
</div>

<dialog id="dlgExport">
  <div class="dlg-topo">
    <h3>Roteiro em texto</h3>
    <button class="bt mini" id="fecharDlg">Fechar</button>
  </div>

    <textarea id="saidaTexto" readonly aria-label="Roteiro formatado"></textarea>
  </div>
  <div class="dlg-pe">
    <button class="bt" id="btCopiar">Copiar texto</button>
    <button class="bt forte" id="btBaixar">Baixar .txt</button>
  </div>
</dialog>

<div class="aviso oculto" id="aviso" role="status"></div>

<script>
/* Adaptador local: recria claude.use("db" | "user" | "downloads") com o
   localStorage do navegador. Só entra em ação fora do Claude (VS Code, navegador). */
(function(){
"use strict";
if(window.claude && typeof window.claude.use==="function") return;

var P="mesa:", mem={}, ls=null;
try{ ls=window.localStorage; ls.setItem(P+"_t","1"); ls.removeItem(P+"_t"); }catch(e){ ls=null; }

function ler(k){ return ls ? ls.getItem(P+k) : (k in mem ? mem[k] : null); }
function gravar(k,v){
  try{ if(ls) ls.setItem(P+k,v); else mem[k]=v; }
  catch(e){ var er=new Error("Armazenamento cheio"); er.code="quota_exceeded"; throw er; }
}
function apagar(k){ if(ls) ls.removeItem(P+k); else delete mem[k]; }
function chaves(){
  var out=[],i,k;
  if(ls){ for(i=0;i<ls.length;i++){ k=ls.key(i); if(k.indexOf(P)===0) out.push(k.slice(P.length)); } }
  else out=Object.keys(mem);
  return out;
}
function novoId(){ return Date.now().toString(36)+Math.random().toString(36).slice(2,7); }

function docRef(path){
  var id=path.split("/").pop();
  return {
    path:path, id:id,
    get:async function(){
      var v=ler(path);
      return {exists:v!==null, id:id, data:function(){ return v===null?undefined:JSON.parse(v); }};
    },
    set:async function(d){ gravar(path,JSON.stringify(d)); },
    update:async function(d){
      var v=ler(path), o=v?JSON.parse(v):{}, k;
      for(k in d) o[k]=d[k];
      gravar(path,JSON.stringify(o));
    },
    delete:async function(){ apagar(path); }
  };
}

function consulta(cp,campo,dir){
  return {
    orderBy:function(c,d){ return consulta(cp,c,d||"asc"); },
    get:async function(){
      var pre=cp+"/";
      var docs=chaves().filter(function(k){
        return k.indexOf(pre)===0 && k.indexOf("/",pre.length)<0;
      }).map(function(k){
        var d=JSON.parse(ler(k));
        return {id:k.slice(pre.length), ref:docRef(k), data:function(){ return d; }};
      });
      if(campo) docs.sort(function(a,b){
        var x=a.data()[campo], y=b.data()[campo], r=x<y?-1:(x>y?1:0);
        return dir==="desc"?-r:r;
      });
      return {docs:docs, size:docs.length, empty:!docs.length, forEach:function(f){ docs.forEach(f); }};
    }
  };
}

var db={
  collection:function(cp){
    var q=consulta(cp);
    q.doc=function(i){ return docRef(cp+"/"+(i||novoId())); };
    q.add=async function(d){ var r=docRef(cp+"/"+novoId()); await r.set(d); return r; };
    return q;
  }
};

var baixador={
  save:async function(o){
    var b=new Blob([o.data],{type:"text/plain;charset=utf-8"});
    var a=document.createElement("a");
    a.href=URL.createObjectURL(b); a.download=o.filename;
    document.body.appendChild(a); a.click(); a.remove();
    setTimeout(function(){ URL.revokeObjectURL(a.href); },1000);
  }
};

window.claude={
  use:async function(nome){
    if(nome==="db") return db;
    if(nome==="user") return {id:async function(){ return "local"; }};
    if(nome==="downloads") return baixador;
    throw new Error("Recurso indisponível: "+nome);
  }
};
})();
</script>
<script>
(function(){
"use strict";

/* ========== escolhas de composição ========== */
var ENQUADRAMENTOS = [
  "", "Estabelecimento", "Ação", "Diálogo", "Reação", "Detalhe",
  "Transição", "Silhueta", "Página dupla"
];
var DISTANCIAS = [
  "", "Muito distante", "Distante", "Média distância", "Próxima", "Muito próxima"
];
var PLANOS = [
  "", "Plano geral", "Plano conjunto", "Plano inteiro", "Plano americano",
  "Plano médio", "Primeiro plano", "Close", "Close extremo", "Detalhe"
];
var ANGULOS_CAMERA = [
  "", "Nível dos olhos", "Plongée (de cima)", "Contra-plongée (de baixo)",
  "Sobre o ombro", "Ponto de vista", "Ângulo holandês", "Vista aérea"
];
var TIPOS_BALAO = [
  ["fala","Fala"], ["pensamento","Pensamento"], ["grito","Grito"],
  ["off","Fora de quadro"], ["sussurro","Sussurro"], ["narracao","Narração"]
];
var ROTULO_BALAO = {
  fala:"", pensamento:"(pensamento)", grito:"(grito)", off:"(fora de quadro)",
  sussurro:"(sussurro)", narracao:"NARRAÇÃO"
};

/* ========== estado ========== */
var db=null, baixador=null, base="roteiros/local";
var obras=[], caps=[], obraAtual=null, capAtual=null, doc=null;
var pendente=null, salvando=false, sujo=false;

var el=function(id){return document.getElementById(id);};
var tela=el("tela"), estado=el("estado");

function id(p){return p+"_"+Date.now().toString(36)+Math.random().toString(36).slice(2,7);}
function esc(s){return String(s==null?"":s).replace(/[&<>"']/g,function(c){
  return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c];});}

var tAviso;
function aviso(txt){
  var a=el("aviso"); a.textContent=txt; a.classList.remove("oculto");
  clearTimeout(tAviso); tAviso=setTimeout(function(){a.classList.add("oculto");},2600);
}

/* ========== armazenamento ========== */
async function iniciarArmazenamento(){
  try{
    var u=await claude.use("user");
    if(u){ var uid=await u.id(); if(uid) base="data/users/"+uid+"/roteiros"; }
  }catch(e){}
  try{ db=await claude.use("db"); }catch(e){ db=null; }
  try{ baixador=await claude.use("downloads"); }catch(e){ baixador=null; }
  if(!baixador){ el("btBaixar").classList.add("oculto"); }
}

function colObras(){ return db.collection(base+"/obras"); }
function colCaps(){ return db.collection(base+"/capitulos"); }

async function carregarListas(){
  if(!db) return;
  var so=await colObras().orderBy("criadoEm","asc").get();
  obras=so.docs.map(function(d){var v=d.data();v.id=d.id;return v;});
  var sc=await colCaps().orderBy("numero","asc").get();
  caps=sc.docs.map(function(d){
    var v=d.data();
    return {id:d.id,obraId:v.obraId,numero:v.numero,titulo:v.titulo,
            nPaineis:contarPaineis(v.paginas)};
  });
}

function contarPaineis(pgs){
  var n=0,i; if(!pgs) return 0;
  for(i=0;i<pgs.length;i++) n+=(pgs[i].paineis||[]).length;
  return n;
}

function marcarSujo(){
  sujo=true; estado.textContent="não salvo";
  clearTimeout(pendente);
  pendente=setTimeout(salvar,700);
}

async function salvar(){
  if(!db||!doc||salvando) return;
  salvando=true; estado.textContent="salvando…";
  try{
    doc.atualizadoEm=Date.now();
    var corpo=JSON.parse(JSON.stringify(doc));
    delete corpo.id;
    await colCaps().doc(doc.id).set(corpo);
    sujo=false; estado.textContent="salvo";
    var c=caps.filter(function(x){return x.id===doc.id;})[0];
    if(c){ c.titulo=doc.titulo; c.numero=doc.numero; c.nPaineis=contarPaineis(doc.paginas); }
    desenharLateral();
  }catch(e){
    estado.textContent="erro ao salvar";
    aviso(e&&e.code==="quota_exceeded"
      ? "Espaço cheio. Apague um capítulo antigo para continuar."
      : "Não foi possível salvar. As mudanças seguem na tela — tente de novo em instantes.");
  }
  salvando=false;
  if(sujo){ clearTimeout(pendente); pendente=setTimeout(salvar,900); }
}

/* ========== lateral ========== */
function desenharLateral(){
  var lo=el("listaObras");
  if(!obras.length){
    lo.innerHTML='<p class="vazio-lateral">Nenhuma obra ainda. Crie a primeira para começar.</p>';
  }else{
    lo.innerHTML=obras.map(function(o){
      var n=caps.filter(function(c){return c.obraId===o.id;}).length;
      return '<button class="item" data-obra="'+o.id+'" aria-current="'+(obraAtual===o.id)+'">'+
        '<span class="rotulo">'+esc(o.titulo||"Sem título")+'</span>'+
        '<span class="contagem">'+n+' cap.</span></button>';
    }).join("");
  }
  var bloco=el("blocoCapitulos"), lc=el("listaCaps");
  if(!obraAtual){ bloco.classList.add("oculto"); }
  else{
    bloco.classList.remove("oculto");
    var meus=caps.filter(function(c){return c.obraId===obraAtual;});
    lc.innerHTML = meus.length ? meus.map(function(c){
      return '<button class="item cap" data-cap="'+c.id+'" aria-current="'+(capAtual===c.id)+'">'+
        '<span class="rotulo">'+esc((c.numero?("#"+c.numero+" "):"")+(c.titulo||"Sem título"))+'</span>'+
        '<span class="contagem">'+c.nPaineis+'</span></button>';
    }).join("") : '<p class="vazio-lateral">Sem capítulos nesta obra.</p>';
  }
}

/* ========== criação ========== */
function abrirFormObra(){
  el("formObra").classList.remove("oculto");
  el("campoObra").value="";
  el("campoObra").focus();
}
function fecharFormObra(){
  el("formObra").classList.add("oculto");
}

async function criarObra(t){
  t=(t||"").trim(); if(!t) return;
  if(!db){ aviso("Sem armazenamento disponível nesta visualização."); return; }
  var o={titulo:t,criadoEm:Date.now()};
  var ref=colObras().doc(id("o"));
  try{ await ref.set(o); }catch(e){ aviso("Não deu para criar a obra. Tente de novo."); return; }
  o.id=ref.path.split("/").pop(); obras.push(o);
  obraAtual=o.id; capAtual=null; doc=null;
  desenharLateral(); desenhar();
  criarCapitulo();
}

async function criarCapitulo(){
  if(!obraAtual||!db) return;
  var meus=caps.filter(function(c){return c.obraId===obraAtual;});
  var novo={
    obraId:obraAtual, numero:meus.length+1, titulo:"",
    paginas:[novaPagina()], atualizadoEm:Date.now()
  };
  var ref=colCaps().doc(id("c"));
  try{ await ref.set(novo); }catch(e){ aviso("Não deu para criar o capítulo. Tente de novo."); return; }
  novo.id=ref.path.split("/").pop();
  caps.push({id:novo.id,obraId:obraAtual,numero:novo.numero,titulo:"",nPaineis:1});
  doc=novo; capAtual=novo.id;
  desenharLateral(); desenhar();
}

function novoPainel(){
  return {
    id:id("p"), enquadramento:"", distancia:"", plano:"", angulo:"",
    acao:"", falas:[{quem:"",tipo:"fala",texto:""}], sfx:""
  };
}
function duplicarPainel(pn){
  return {
    id:id("p"), enquadramento:pn.enquadramento||pn.tipoPainel||"", distancia:pn.distancia||"",
    plano:pn.plano||"", angulo:pn.angulo||"", acao:pn.acao||"",
    falas:(pn.falas||[]).map(function(f){return {quem:f.quem||"",tipo:f.tipo||"fala",texto:f.texto||""};}),
    sfx:pn.sfx||""
  };
}
function duplicarPagina(pg){
  return {id:id("pg"),paineis:(pg.paineis||[]).map(duplicarPainel)};
}
function resumoPainel(pn){
  var t=(pn.acao||"").trim();
  if(!t && pn.falas && pn.falas.length) t=(pn.falas[0].texto||"").trim();
  if(!t) return "(painel vazio)";
  return t.length>36 ? t.slice(0,36)+"…" : t;
}
function novaPagina(qtd){
  var n=qtd||1, paineis=[], i;
  for(i=0;i<n;i++) paineis.push(novoPainel());
  return {id:id("pg"),paineis:paineis};
}

/* Converte o antigo campo único de enquadramento, sem perder roteiros já salvos. */
function normalizarPainel(pn){
  if(!pn) return;
  pn.enquadramento=pn.enquadramento||pn.tipoPainel||"";
  pn.distancia=pn.distancia||"";
  pn.plano=pn.plano||"";
  pn.angulo=pn.angulo||"";
  pn.falas=pn.falas||[];
  if(!pn.falas.length) pn.falas.push({quem:"",tipo:"fala",texto:""});
  var antigo=pn.enq||"";
  if(!antigo) return;
  if(!pn.plano && PLANOS.indexOf(antigo)>-1) pn.plano=antigo;
  else if(!pn.angulo && ANGULOS_CAMERA.indexOf(antigo)>-1) pn.angulo=antigo;
  else if(!pn.enquadramento && ENQUADRAMENTOS.indexOf(antigo)>-1) pn.enquadramento=antigo;
}
function normalizarDocumento(d){
  (d.paginas||[]).forEach(function(pg){
    (pg.paineis||[]).forEach(normalizarPainel);
  });
}

async function abrirCapitulo(cid){
  if(sujo){ clearTimeout(pendente); await salvar(); }
  try{
    var s=await colCaps().doc(cid).get();
    if(!s.exists){ aviso("Capítulo não encontrado."); return; }
    doc=s.data(); doc.id=cid; capAtual=cid; obraAtual=doc.obraId;
    if(!doc.paginas||!doc.paginas.length) doc.paginas=[novaPagina()];
    normalizarDocumento(doc);
    estado.textContent="salvo";
    desenharLateral(); desenhar();
    el("lateral").classList.remove("aberta");
    el("tela").scrollTop=0;
  }catch(e){ aviso("Não foi possível abrir o capítulo."); }
}

/* ========== desenho do roteiro ========== */
function desenhar(){
  el("tituloCap").disabled=!doc;
  el("btExportar").disabled=!doc;
  el("tituloCap").value=doc?(doc.titulo||""):"";

  if(!doc){
    tela.innerHTML=
      '<div class="centro">'+
      '<h2>'+(obras.length?"Escolha um capítulo":"Comece pela obra")+'</h2>'+
      '<p>'+(obras.length
        ? "Selecione um capítulo na lista ao lado, ou crie um novo."
        : "Cada obra guarda seus capítulos; cada capítulo se divide em páginas, e cada página em painéis. Tudo é salvo sozinho enquanto você escreve.")+'</p>'+
      '<button class="bt forte" id="comecar">'+(obras.length?"Novo capítulo":"Criar primeira obra")+'</button>'+
      '</div>';
    var b=el("comecar");
    if(b) b.onclick=obras.length?criarCapitulo:abrirFormObra;
    return;
  }

  var total=contarPaineis(doc.paginas);
  var html='<div class="folha">';
  doc.paginas.forEach(function(pg,ip){
    var np=(pg.paineis||[]).length;
    var denso=np>8;
    html+='<section class="pagina" data-pg="'+pg.id+'">'+
      '<div class="cabeca-pagina">'+
        '<h2>Página '+(ip+1)+'</h2>'+
        '<span class="info'+(denso?" aviso-densidade":"")+'">'+np+(np===1?" painel":" painéis")+
          (denso?" — bem cheia para uma página":"")+'</span>'+
        '<button class="bt-texto" data-acao="add-painel" data-pg="'+pg.id+'">+ painel</button>'+
        (np>0?'<button class="bt-texto" data-acao="duplicar-pagina" data-pg="'+pg.id+'">duplicar página</button>':'')+
        (doc.paginas.length>1?'<button class="bt-texto" data-acao="del-pagina" data-pg="'+pg.id+'">apagar página</button>':'')+
      '</div>';
    (pg.paineis||[]).forEach(function(pn,i){ html+=htmlPainel(pn,i,ip,np); });
    html+='</section>';
  });
  html+='<button class="add-pagina" data-acao="add-pagina">+ Nova página</button>';
  html+='<p style="color:var(--fraco);font-size:12.5px;margin-top:14px">'+
        doc.paginas.length+(doc.paginas.length===1?" página":" páginas")+" · "+
        total+(total===1?" painel":" painéis")+'</p>';
  html+='</div>';
  tela.innerHTML=html;
}

function opcoesSelect(opcoes, valor, vazio){
  return opcoes.map(function(opcao){
    return '<option value="'+esc(opcao)+'"'+(valor===opcao?" selected":"")+'>'+
      (opcao||vazio)+'</option>';
  }).join("");
}

function htmlPainel(pn,i,ip,np){
  var h='<article class="painel" data-pn="'+pn.id+'" data-pg-idx="'+ip+'">'+
    '<div class="painel-topo">'+
      '<span class="num">'+(i+1)+'</span>'+
      '<span class="painel-rotulo">Painel '+(i+1)+'</span>'+
      '<div class="acoes">'+
        '<button class="bt mini" data-acao="subir" '+(i===0?"disabled":"")+' aria-label="Mover para cima">↑</button>'+
        '<button class="bt mini" data-acao="descer" '+(i===np-1?"disabled":"")+' aria-label="Mover para baixo">↓</button>'+
        '<button class="bt mini" data-acao="duplicar-painel" aria-label="Duplicar este painel" title="Duplicar">⧉</button>'+
        '<button class="bt mini risco" data-acao="del-painel" aria-label="Apagar painel">✕</button>'+
      '</div>'+
    '</div>'+
    '<div class="corpo">'+
      '<div class="campos-painel">'+
        '<div class="campo"><label>Enquadramento</label>'+
          '<select data-campo="enquadramento" aria-label="Enquadramento do painel '+(i+1)+'">'+
            opcoesSelect(ENQUADRAMENTOS,pn.enquadramento,"Escolha o enquadramento")+
          '</select></div>'+
        '<div class="campo"><label>Distância</label>'+
          '<select data-campo="distancia" aria-label="Distância do painel '+(i+1)+'">'+
            opcoesSelect(DISTANCIAS,pn.distancia,"Escolha a distância")+
          '</select></div>'+
        '<div class="campo"><label>Plano</label>'+
          '<select data-campo="plano" aria-label="Plano do painel '+(i+1)+'">'+
            opcoesSelect(PLANOS,pn.plano,"Escolha o plano")+
          '</select></div>'+
        '<div class="campo"><label>Ângulo</label>'+
          '<select data-campo="angulo" aria-label="Ângulo do painel '+(i+1)+'">'+
            opcoesSelect(ANGULOS_CAMERA,pn.angulo,"Escolha o ângulo")+
          '</select></div>'+
      '</div>'+
      '<div class="campo"><label>Desenho</label>'+
        '<textarea class="acao" data-campo="acao" placeholder="Descreva o que deve aparecer no desenho.">'+esc(pn.acao)+'</textarea></div>'+
      '<div class="campo"><label>Fala</label><div class="falas">';
  (pn.falas||[]).forEach(function(f,j){ h+=htmlFala(f,j); });
  h+='</div><button class="bt-texto" data-acao="add-fala">+ fala</button></div>'+
      '<div class="campo"><label>Onomatopeia</label>'+

function htmlFala(f,j){
  return '<div class="fala" data-fala="'+j+'">'+
    '<div class="diz"><textarea data-fala-campo="texto" aria-label="Fala '+(j+1)+'" placeholder="Escreva a fala">'+esc(f.texto)+'</textarea></div>'+
    '<button class="bt mini risco rm" data-acao="del-fala" aria-label="Apagar fala">✕</button>'+
  '</div>';
}

/* ========== localizar dados a partir do DOM ========== */
function acharPainel(node){
  var art=node.closest(".painel"); if(!art||!doc) return null;
  var pid=art.getAttribute("data-pn");
  for(var a=0;a<doc.paginas.length;a++){
    var lst=doc.paginas[a].paineis||[];
    for(var b=0;b<lst.length;b++) if(lst[b].id===pid)
      return {pagina:doc.paginas[a],ipg:a,painel:lst[b],ipn:b};
  }
  return null;
}
function acharPagina(pid){
  for(var a=0;a<doc.paginas.length;a++) if(doc.paginas[a].id===pid) return a;
  return -1;
}
function acharPainelPorId(pid){
  for(var a=0;a<doc.paginas.length;a++){
    var lst=doc.paginas[a].paineis||[];
    for(var b=0;b<lst.length;b++) if(lst[b].id===pid) return lst[b];
  }
  return null;
}
function listaDuplicaveis(limite){
  var out=[];
  doc.paginas.forEach(function(pg,ip){
    (pg.paineis||[]).forEach(function(pn,i){
      out.push({id:pn.id,rotulo:"P"+(ip+1)+"."+(i+1)+" — "+resumoPainel(pn)});
    });
  });
  out.reverse();
  return limite ? out.slice(0,limite) : out;
}

/* confirmação de duplo clique, sem depender de confirm() nativo (bloqueado em alguns visualizadores) */
function confirmarClique(btn, textoConfirmar, executar){
  if(btn.getAttribute("data-armado")==="1"){
    executar();
  }else{
    var original=btn.textContent;
    btn.setAttribute("data-armado","1");
    btn.textContent=textoConfirmar;
    setTimeout(function(){
      if(btn.isConnected){ btn.removeAttribute("data-armado"); btn.textContent=original; }
    },2600);
  }
}

/* ========== escolha de quantidade ao adicionar ========== */
var popQtd=document.createElement("div");
popQtd.className="pop-qtd oculto";
popQtd.setAttribute("role","menu");
document.body.appendChild(popQtd);
var popQtdCb=null, popQtdAncora=null;

function montarPopQtd(opts){
  opts=opts||{};
  var opcoes=[1,2,3,4,6];
  var html=
    '<div class="pop-qtd-titulo">'+(opts.duplicaveis&&opts.duplicaveis.length?"Em branco":"Quantos?")+'</div>'+
    opcoes.map(function(n){
      return '<button type="button" class="pop-qtd-item" data-n="'+n+'">'+n+(n===1?" painel":" painéis")+'</button>';
    }).join("")+
    '<div class="pop-qtd-outro">'+
      '<input type="number" min="1" max="24" step="1" id="popQtdNum" placeholder="Outro nº">'+
      '<button type="button" class="bt mini" id="popQtdNumOk">OK</button>'+
    '</div>';
  if(opts.duplicaveis && opts.duplicaveis.length){
    html+='<div class="pop-qtd-titulo pop-qtd-sep">Duplicar painel já escrito</div>'+
      opts.duplicaveis.map(function(d){
        return '<button type="button" class="pop-qtd-item" data-dup="'+d.id+'">'+esc(d.rotulo)+'</button>';
      }).join("");
  }
  popQtd.innerHTML=html;
}
function abrirEscolhaQtd(ancora,cb,opts){
  montarPopQtd(opts);
  popQtdCb=cb; popQtdAncora=ancora;
  var r=ancora.getBoundingClientRect();
  popQtd.classList.remove("oculto");
  var largura=popQtd.offsetWidth||170, altura=popQtd.offsetHeight||150;
  var topo=r.bottom+6;
  if(topo+altura>window.innerHeight-10) topo=Math.max(10,r.top-altura-6);
  var esquerda=Math.min(r.left,window.innerWidth-largura-10);
  popQtd.style.top=Math.round(topo)+"px";
  popQtd.style.left=Math.round(Math.max(10,esquerda))+"px";
}
function fecharEscolhaQtd(){
  popQtd.classList.add("oculto"); popQtdCb=null; popQtdAncora=null;
}
popQtd.addEventListener("click",function(ev){
  var it=ev.target.closest(".pop-qtd-item"); if(!it) return;
  var cb=popQtdCb;
  if(it.hasAttribute("data-dup")){
    var pid=it.getAttribute("data-dup"); fecharEscolhaQtd(); if(cb) cb(null,pid); return;
  }
  var n=parseInt(it.getAttribute("data-n"),10); fecharEscolhaQtd(); if(cb) cb(n,null);
});
popQtd.addEventListener("click",function(ev){
  if(ev.target.id==="popQtdNumOk"){
    var v=parseInt(el("popQtdNum").value,10); var cb=popQtdCb;
    if(v>0){ fecharEscolhaQtd(); if(cb) cb(v,null); }
  }
});
popQtd.addEventListener("keydown",function(ev){
  if(ev.key==="Enter" && ev.target.id==="popQtdNum"){
    ev.preventDefault(); el("popQtdNumOk").click();
  }
});
document.addEventListener("click",function(ev){
  if(popQtd.classList.contains("oculto")) return;
  if(popQtd.contains(ev.target)) return;
  if(popQtdAncora && popQtdAncora.contains(ev.target)) return;
  fecharEscolhaQtd();
});
document.addEventListener("keydown",function(ev){
  if(ev.key==="Escape") fecharEscolhaQtd();
});

/* ========== eventos ========== */
el("novaObra").onclick=abrirFormObra;
el("cancelarObra").onclick=fecharFormObra;
el("formObra").addEventListener("submit",function(ev){
  ev.preventDefault();
  var t=el("campoObra").value;
  fecharFormObra();
  criarObra(t);
});
el("novoCap").onclick=criarCapitulo;
el("btMenu").onclick=function(){ el("lateral").classList.toggle("aberta"); };

el("tituloCap").addEventListener("input",function(){
  if(!doc) return; doc.titulo=this.value; marcarSujo();
});

document.querySelector(".rolagem").addEventListener("click",function(ev){
  var b=ev.target.closest("[data-obra],[data-cap]");
  if(!b) return;
  if(b.hasAttribute("data-obra")){
    obraAtual=b.getAttribute("data-obra");
    var meus=caps.filter(function(c){return c.obraId===obraAtual;});
    desenharLateral();
    if(meus.length) abrirCapitulo(meus[0].id);
    else{ capAtual=null; doc=null; desenhar(); }
  }else{
    abrirCapitulo(b.getAttribute("data-cap"));
  }
});

tela.addEventListener("click",function(ev){
  var b=ev.target.closest("[data-acao]"); if(!b||!doc) return;
  var acao=b.getAttribute("data-acao");

  if(acao==="add-pagina"){
    abrirEscolhaQtd(b,function(n){
      doc.paginas.push(novaPagina(n)); marcarSujo(); desenhar();
    });
    return;
  }
  if(acao==="add-painel"){
    var pgId=b.getAttribute("data-pg");
    abrirEscolhaQtd(b,function(n,dupId){
      var k=acharPagina(pgId), i;
      if(k<0) return;
      if(dupId){
        var origem=acharPainelPorId(dupId);
        if(origem) doc.paginas[k].paineis.push(duplicarPainel(origem));
      }else{
        for(i=0;i<n;i++) doc.paginas[k].paineis.push(novoPainel());
      }
      marcarSujo(); desenhar();
    },{duplicaveis:listaDuplicaveis(20)});
    return;
  }
  if(acao==="duplicar-pagina"){
    var jd=acharPagina(b.getAttribute("data-pg"));
    if(jd>-1){ doc.paginas.splice(jd+1,0,duplicarPagina(doc.paginas[jd])); marcarSujo(); desenhar(); }
    return;
  }
  if(acao==="del-pagina"){
    var j=acharPagina(b.getAttribute("data-pg"));
    if(j>-1) confirmarClique(b,"Clique p/ confirmar",function(){
      doc.paginas.splice(j,1);
      if(!doc.paginas.length) doc.paginas=[novaPagina()];
      marcarSujo(); desenhar();
    });
    return;
  }

  var loc=acharPainel(b); if(!loc) return;
  var lst=loc.pagina.paineis;
  if(acao==="subir" && loc.ipn>0){
    lst.splice(loc.ipn-1,0,lst.splice(loc.ipn,1)[0]); marcarSujo(); desenhar();
  }else if(acao==="descer" && loc.ipn<lst.length-1){
    lst.splice(loc.ipn+1,0,lst.splice(loc.ipn,1)[0]); marcarSujo(); desenhar();
  }else if(acao==="duplicar-painel"){
    lst.splice(loc.ipn+1,0,duplicarPainel(loc.painel)); marcarSujo(); desenhar();
  }else if(acao==="del-painel"){
    confirmarClique(b,"✕ confirmar",function(){ lst.splice(loc.ipn,1); marcarSujo(); desenhar(); });
  }else if(acao==="add-fala"){
    loc.painel.falas=loc.painel.falas||[];
    loc.painel.falas.push({quem:"",tipo:"fala",texto:""});
    marcarSujo(); desenhar();
    var art=tela.querySelector('[data-pn="'+loc.painel.id+'"]');
    var ta=art&&art.querySelectorAll('.fala textarea');
    if(ta&&ta.length) ta[ta.length-1].focus();
  }else if(acao==="del-fala"){
    var lf=ev.target.closest(".fala");
    var indiceFala=parseInt(lf.getAttribute("data-fala"),10);
    if(loc.painel.falas.length===1) loc.painel.falas[0].texto="";
    else loc.painel.falas.splice(indiceFala,1);
    marcarSujo(); desenhar();
  }
});

function aoEditar(ev){
  var t=ev.target; if(!doc) return;
  var loc=acharPainel(t); if(!loc) return;

  var campo=t.getAttribute("data-campo");
  if(campo){ loc.painel[campo]=t.value; marcarSujo(); if(campo==="enq") return; return; }

  var fc=t.getAttribute("data-fala-campo");
  if(fc){
    var lf=t.closest(".fala"), j=parseInt(lf.getAttribute("data-fala"),10);
    var f=loc.painel.falas[j]; if(!f) return;
    f[fc]=t.value;
    if(fc==="tipo") lf.className="fala balao-"+t.value;
    marcarSujo(); atualizarPersonagens();
  }
}
tela.addEventListener("input",aoEditar);
tela.addEventListener("change",aoEditar);

/* lista de personagens para autocompletar */
var dl=document.createElement("datalist"); dl.id="personagens"; document.body.appendChild(dl);
function atualizarPersonagens(){
  if(!doc) return;
  var set={};
  doc.paginas.forEach(function(pg){(pg.paineis||[]).forEach(function(pn){
    (pn.falas||[]).forEach(function(f){ if(f.quem&&f.quem.trim()) set[f.quem.trim()]=1; });
  });});
  dl.innerHTML=Object.keys(set).map(function(n){return '<option value="'+esc(n)+'">';}).join("");
}

/* ========== exportação ========== */
function nomeObra(){
  var o=obras.filter(function(x){return x.id===(doc&&doc.obraId);})[0];
  return o?(o.titulo||"Sem título"):"Sem título";
}
function fichaPainel(pn){
  var itens=[];
  if(pn.enquadramento) itens.push("Enquadramento: "+pn.enquadramento);
  else if(pn.tipoPainel) itens.push("Enquadramento: "+pn.tipoPainel);
  if(pn.distancia) itens.push("Distância: "+pn.distancia);
  if(pn.plano) itens.push("Plano: "+pn.plano);
  if(pn.angulo) itens.push("Ângulo: "+pn.angulo);
  if(!itens.length && pn.enq) itens.push(pn.enq);
  return itens.join(" · ");
}
function paraTexto(){
  if(!doc) return "";
  var L=[];
  L.push(nomeObra().toUpperCase());
  L.push("Capítulo "+(doc.numero||1)+(doc.titulo?" — "+doc.titulo:""));
  L.push("");
  doc.paginas.forEach(function(pg,ip){
    var np=(pg.paineis||[]).length;
    L.push("=== PÁGINA "+(ip+1)+" ("+np+(np===1?" painel":" painéis")+") ===");
    L.push("");
    (pg.paineis||[]).forEach(function(pn,i){
      var ficha=fichaPainel(pn);
      L.push("PAINEL "+(i+1)+(ficha?"  ["+ficha+"]":""));
      if(pn.acao) L.push(pn.acao.trim());
      (pn.falas||[]).forEach(function(f){
        var texto=(f.texto||"").trim();
        if(texto) L.push("   FALA: "+texto);
      });
      if(pn.sfx) L.push("   SFX: "+pn.sfx.trim());
      L.push("");
    });
  });
  return L.join("\n");
}

el("btExportar").onclick=function(){
  el("saidaTexto").value=paraTexto();
  el("dlgExport").showModal();
};
el("fecharDlg").onclick=function(){ el("dlgExport").close(); };
el("btCopiar").onclick=async function(){
  var t=el("saidaTexto");
  try{ await navigator.clipboard.writeText(t.value); aviso("Texto copiado."); }
  catch(e){ t.focus(); t.select(); aviso("Use Ctrl+C para copiar o texto selecionado."); }
};
el("btBaixar").onclick=async function(){
  if(!baixador){ aviso("Download indisponível aqui — copie o texto."); return; }
  var nome=(nomeObra()+" cap "+(doc.numero||1)).replace(/[^\wÀ-ÿ \-]/g,"").trim()+".txt";
  try{ await baixador.save({filename:nome,data:paraTexto()}); }
  catch(e){ aviso("Download não concluído."); }
};

window.addEventListener("beforeunload",function(e){
  if(sujo){ e.preventDefault(); e.returnValue=""; }
});

/* ========== arranque ========== */
tela.innerHTML='<div class="centro"><h2>Abrindo a mesa…</h2><p>Buscando suas obras.</p></div>';
(async function(){
  await iniciarArmazenamento();
  if(!db){
    tela.innerHTML='<div class="centro"><h2>Sem armazenamento nesta visualização</h2>'+
      '<p>Esta página guarda os roteiros na sua conta. Abra o link pela sua conta Claude para escrever e salvar.</p></div>';
    estado.textContent="";
    return;
  }
  try{ await carregarListas(); }catch(e){}
  desenharLateral();
  var ult=caps.filter(function(c){return true;});
  if(ult.length){ obraAtual=ult[ult.length-1].obraId; await abrirCapitulo(ult[ult.length-1].id); }
  else{ desenhar(); }
  atualizarPersonagens();
})();
})();
